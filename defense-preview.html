<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>列國紀元 · 防禦美術檢閱</title>
<style>body{margin:0;background:#151d18;color:#e9dfc9;font:16px system-ui}header{padding:24px 4vw;border-bottom:1px solid #86734c;background:#202820}h1{font-size:26px;margin:0 0 10px}p{color:#bcbba5;line-height:1.6}select{padding:10px;background:#303b31;color:#f1e4c5;border:1px solid #86734c;margin:4px 12px 4px 0}main{padding:24px 4vw}.ages{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:16px}.age{background:#273426;border:1px solid #536044;border-radius:8px;padding:12px}h2{font-size:17px;color:#dfc587}figure{margin:8px 0;border-bottom:1px solid #465340}canvas{width:100%;height:190px;object-fit:contain;background:radial-gradient(ellipse at 50% 80%,#4c603d,transparent 68%)}figcaption{padding:8px;text-align:center;color:#d6c9a7}#status{color:#bdddac}@media(max-width:950px){.ages{grid-template-columns:repeat(2,minmax(180px,1fr))}}@media(max-width:450px){.ages{grid-template-columns:1fr}}</style>
<header><h1>列國紀元 · 各國防禦美術</h1><p>城牆、城門、防塔 · 12 國 × 3 背景 × 4 年代<br>原創地域風格的遊戲設計；年代為既有遊戲階段，並非逐年代史實復原。</p><label>國籍 <select id="nation"></select></label><label>背景 <select id="family"><option value="historical">歷史風格</option><option value="modern">現代科技</option><option value="fantasy">架空歷史</option></select></label><div id="status" role="status"></div></header><main><div class="ages" id="ages"></div></main>
<script src="cultures.js"></script><script src="defense-art.js"></script><script>
const nation=document.getElementById('nation'),family=document.getElementById('family'),ages=document.getElementById('ages'),status=document.getElementById('status');let request=0;
for(const c of Object.values(CULTURES)){const o=document.createElement('option');o.value=c.code;o.textContent=c.name;nation.append(o)}
function render(){const seq=++request,def=DEFENSE_ART.atlases[nation.value+'-'+family.value];ages.replaceChildren();if(!def){status.textContent='本組素材尚待驗收';return}status.textContent='載入中…';const image=new Image();image.onload=()=>{if(seq!==request)return;for(let age=0;age<4;age++){const section=document.createElement('section');section.className='age';const title=document.createElement('h2');title.textContent='第 '+(age+1)+' 年代';section.append(title);for(let type=0;type<3;type++){const fig=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');canvas.width=360;canvas.height=260;const r=def.rects[age*3+type],scale=Math.min(320/r[2],232/r[3]),w=r[2]*scale,h=r[3]*scale;canvas.getContext('2d').drawImage(image,...r,(360-w)/2,250-h,w,h);canvas.setAttribute('aria-label',['城牆','城門','防塔'][type]+' 第'+(age+1)+'年代');caption.textContent=['城牆','城門','防塔'][type];fig.append(canvas,caption);section.append(fig)}ages.append(section)}status.textContent='本組 12 個外觀已載入 · 全批 '+Object.keys(DEFENSE_ART.atlases).length*12+' / 432 個已接入';};image.onerror=()=>status.textContent='素材載入失敗';image.src='defense/'+def.file}
nation.onchange=family.onchange=render;render();
</script></html>
