<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建築與載具美術檢閱</title><style>
*{box-sizing:border-box}body{margin:0;background:#18211c;color:#eee2c8;font:15px system-ui}header{padding:20px 24px;position:sticky;top:0;background:#18211cf5;border-bottom:1px solid #9f895b;z-index:1}h1{font-size:24px;margin:0 0 12px}select{background:#2c342b;color:inherit;padding:8px;border:1px solid #927b51}#status{margin-left:16px;color:#c5baa0}main{display:grid;grid-template-columns:repeat(8,minmax(140px,1fr));gap:8px;padding:18px;overflow-x:auto}figure{margin:0;border:1px solid #66734e;background:radial-gradient(ellipse,#596943,#2d3b29);text-align:center}canvas{display:block;width:100%;height:auto}figcaption{font-size:12px;padding:8px;background:#1b241cdf}.pending{border-color:#b88352}.pending figcaption{color:#edc48d}p{line-height:1.6;font-size:13px;margin:10px 0 0;color:#c5baa0}
</style><header><h1>經濟建築・船艦・攻城載具</h1><select id="atlas" aria-label="國籍與背景"></select><span id="status"></span><p>每列一個年代。缺項清楚標記「待修正」，不以共用圖充作專屬素材。拖曳頁面橫向捲動可看完整八類。</p></header><main id="grid"></main><script src="expansion-art.js"></script><script>
const names={tc:'主城',house:'住宅',barracks:'步兵營',range:'遠程訓練場',stable:'載具工廠',store:'倉庫',farm:'農田',villager:'工程人員',infantry:'步兵',ranged:'遠程兵',cavalry:'騎乘／載具',lumber:'伐木場',mine:'礦場',mill:'磨坊',market:'市場',dock:'港口',siege:'攻城載具',transport:'運輸船',warship:'戰船',wall:'城牆',gate:'城門',tower:'防塔',airfield:'機場／空中巢穴',aa:'防空設施',silo:'戰略發射設施',wonder:'奇觀',fighter:'空戰單位',bomber:'空中轟炸單位',airlift:'空運單位'};const select=document.getElementById('atlas');for(const key of Object.keys(EXPANSION_ART.atlases))select.add(new Option(key,key));
let revision=0;function render(){const rev=++revision,key=select.value,def=EXPANSION_ART.atlases[key],grid=document.getElementById('grid');grid.replaceChildren();if(!def)return;const columns=def.columns||EXPANSION_ART.columns;grid.style.gridTemplateColumns='repeat('+columns.length+',minmax(140px,1fr))';const im=new Image();document.getElementById('status').textContent='載入中';im.onload=()=>{if(rev!==revision)return;let count=0;for(let i=0;i<def.rects.length;i++){const f=document.createElement('figure'),c=document.createElement('canvas'),cap=document.createElement('figcaption');c.width=240;c.height=230;const r=def.rects[i];if(r){const z=Math.min(216/r[2],204/r[3]);c.getContext('2d').drawImage(im,...r,(240-r[2]*z)/2,216-r[3]*z,r[2]*z,r[3]*z);count++}else f.className='pending';cap.textContent='第'+(Math.floor(i/columns.length)+1)+'階段 · '+(names[columns[i%columns.length]]||columns[i%columns.length])+(r?'':' · 使用其他圖集備援');f.append(c,cap);grid.append(f)}document.getElementById('status').textContent=count+'/'+def.rects.length+' 個有效裁切';};im.onerror=()=>document.getElementById('status').textContent='圖片載入失敗';im.src='expansion/'+def.file}select.onchange=render;render();
</script></html>
